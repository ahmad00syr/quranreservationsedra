<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ختمة القلب المزهر</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header-text">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
        <div id="status">إجمالي الصفحات المحفوظة: 0 / 604</div>

        <!-- هنا سيُرسَم القلب البرمجي النظيف -->
        <div id="heart-container"></div>

        <div class="footer-text">وَكَانَ فَضْلُ اللَّهِ عَلَيْكَ عَظِيمًا</div>

        <div class="input-panel">
            <input type="text" id="surahInput" placeholder="اكتبي: اسم السورة, عدد الصفحات (مثال: البقرة, 10)">
            <button id="updateBtn">تلوين التقدم</button>
            <button id="resetBtn" class="secondary-btn">مسح الكل</button>
        </div>
    </div>

    <script src="render.js"></script>
    <script src="input.js"></script>
</body>
</html>
